services:
  - type: web
    name: octareview
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /comercial
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_GOOGLE_MAPS_ACTOR_ID
        value: compass/crawler-google-places
